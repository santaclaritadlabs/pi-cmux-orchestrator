name: CI

on:
  push:
    branches: [main]
  pull_request:

# No credentials, no network access to provider CLIs, no write scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: CI must never resolve a version the lockfile does
      # not already pin. Dependency lifecycle scripts stay disabled via .npmrc.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The committed JSON Schemas must match what packages/protocol emits.
      # A drift here means the serialized contract and the zod schemas disagree.
      - name: Assert generated artifacts are committed
        run: git diff --exit-code
